<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Kavindu Damsith</title>
  <desc id="desc">Full-stack product engineer working across cloud systems and applied artificial intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070B18"/>
      <stop offset="0.55" stop-color="#0C1830"/>
      <stop offset="1" stop-color="#112B59"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4F86FF"/>
      <stop offset="1" stop-color="#78C7FF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#4F86FF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#4F86FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#A8C7FF" stroke-opacity=".055"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="28" fill="url(#grid)"/>
  <circle cx="1045" cy="150" r="275" fill="url(#glow)"/>

  <g fill="none" stroke="#72A6FF">
    <circle cx="1030" cy="195" r="116" stroke-opacity=".2"/>
    <circle cx="1030" cy="195" r="85" stroke-opacity=".26"/>
    <circle cx="1030" cy="195" r="51" stroke-opacity=".34"/>
    <path d="M860 195h340M1030 24v342" stroke-opacity=".12"/>
    <path d="M912 76l236 238M1148 76L912 314" stroke-opacity=".08"/>
  </g>

  <g fill="#78C7FF" filter="url(#softGlow)">
    <circle cx="1030" cy="79" r="4"/>
    <circle cx="1115" cy="195" r="4"/>
    <circle cx="979" cy="195" r="3"/>
  </g>

  <rect x="55" y="52" width="5" height="286" rx="2.5" fill="url(#accent)"/>
  <rect x="82" y="58" width="218" height="32" rx="16" fill="#102344" stroke="#3769BF" stroke-opacity=".7"/>
  <circle cx="102" cy="74" r="5" fill="#6EA4FF"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="117" y="80" fill="#B9CEFA" font-size="13" font-weight="700" letter-spacing="2">AVAILABLE TO COLLABORATE</text>
    <text x="82" y="150" fill="#F4F7FF" font-size="64" font-weight="700" letter-spacing="-2">Kavindu Damsith</text>
    <text x="84" y="194" fill="#9FC0FF" font-size="18" font-weight="700" letter-spacing="3">FULL-STACK  /  CLOUD  /  APPLIED AI</text>
    <text x="84" y="239" fill="#CBD8F0" font-size="22">I build useful digital products from interface to infrastructure.</text>

    <g font-size="15" font-weight="700">
      <rect x="83" y="279" width="118" height="35" rx="17.5" fill="#12274B" stroke="#315A9B"/>
      <text x="105" y="302" fill="#D8E5FF">SRI LANKA</text>
      <rect x="215" y="279" width="222" height="35" rx="17.5" fill="#12274B" stroke="#315A9B"/>
      <text x="237" y="302" fill="#D8E5FF">KAVINDUDAMSITH.TECH</text>
    </g>

    <text x="988" y="216" fill="#F0F5FF" font-size="53" font-weight="700" letter-spacing="-2">KD</text>
    <text x="966" y="241" fill="#8EB6FF" font-size="11" font-weight="700" letter-spacing="3">ENGINEER</text>
  </g>
</svg>
